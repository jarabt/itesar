<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="side">
          <div class="title">
            <h1>Weby a online nástroje</h1>
            <img class="logo" src="./images/logo.svg" alt="Logo" />
          </div>
          <img class="foto" src="./images/foto.png" alt="Foto" />
        </div>
        <div class="side">
          <div class="card">
            <h2>O mně</h2>
            <p>
              Jsem Ing. Jaroslav Tesař s pětiletou praxí programátora v
              softwarových firmách. Specializuji se na internetová softwarová
              řešení (webové programy/aplikace) a internetové stránky (weby) a
              upřednostňuji dlouhodobou spolupráci.
            </p>
          </div>
          <div class="menu">
            <h3>PORTFOLIO</h3>
            <h3>KONTAKT</h3>
          </div>
          <div class="social-media">
            <img class="icon" src="./images/linkedin.svg" alt="Linkedin icon" />
            <img class="icon" src="./images/facebook.svg" alt="Facebook icon" />
            <img
              class="icon"
              src="./images/twitter-x.svg"
              alt="Twitter-X icon"
            />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
